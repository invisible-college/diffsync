
<body>
<script src="https://unpkg.com/@braid.org/diffsync"></script>
<textarea id="t" style="width:100%;height:100%"></textarea>
<script>

var ds = diffsync.create_client({
	ws_url : 'ws://localhost:' + diffsync.port,
	channel : 'goop4',
	get_text : function () {
	    return t.value
	},
	get_range : function () {
	    return [t.selectionStart, t.selectionEnd]
	},
	on_text : function (text, range) {
	    t.value = text
	    t.setSelectionRange(range[0], range[1])
	},
	on_range : null
})

t.onkeyup = function () {
    ds.on_change()
}
t.onpaste = function () {
    setTimeout(function () {
        ds.on_change()
    }, 0)
}

</script>
</body>
